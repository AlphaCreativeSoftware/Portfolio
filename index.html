    <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      try {
        const storedTheme = localStorage.getItem('portfolio-theme') || 'system'
        const storedSolarMode = localStorage.getItem('portfolio-solar-mode') || 'auto'
        const darkTheme = storedTheme === 'dark' || (storedTheme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        const now = new Date()
        const minutes = now.getHours() * 60 + now.getMinutes()
        const period = minutes >= 1230 || minutes < 300 ? 'night' : minutes < 720 ? 'morning' : 'afternoon'
        document.documentElement.dataset.theme = storedTheme
        document.documentElement.dataset.appearance = darkTheme ? 'dark' : 'light'
        const atmosphere = storedSolarMode === 'auto' ? period : storedSolarMode
        document.documentElement.dataset.atmosphere = atmosphere
        let right = 7
        let top = 18
        if (atmosphere === 'night' && period !== 'night') {
          right = 8
          top = 20
        } else {
          const start = atmosphere === 'night' ? 1230 : 300
          const duration = atmosphere === 'night' ? 510 : 930
          const elapsed = atmosphere === 'night' && minutes < 300 ? minutes + 1440 - start : minutes - start
          const progress = Math.min(1, Math.max(0, elapsed / duration))
          right = 4 + (1 - progress) * 9
          top = 16 + (1 - Math.sin(progress * Math.PI)) * 16
        }
        document.documentElement.style.setProperty('--celestial-right', `${right}vw`)
        document.documentElement.style.setProperty('--celestial-top', `${top}%`)
        document.querySelector('meta[name="theme-color"]').content = darkTheme ? '#000000' : '#ffffff'
      } catch (_) {}
    </script>
    <title>Mikael Rodríguez — Software, producto y tecnología</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
